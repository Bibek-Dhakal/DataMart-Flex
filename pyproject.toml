[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datamart-flex"
version = "0.1.0"
description = "Enterprise Star-Schema Data Mart and Self-Serve BI Analytics Hub"
authors = [{ name = "Bibek Dhakal" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "duckdb",
    "faker",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit"
]
notebooks = [
    "jupyter",
    "matplotlib",
    "seaborn"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
